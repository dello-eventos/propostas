<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Propostas · DelloPlast mudou de endereço</title>
<link rel="canonical" href="https://henriquegambin.github.io/propostas/">
<script>
  // O sistema de propostas mudou para https://henriquegambin.github.io/propostas/
  // Mantém o resto do endereço (?demo, #/proposta/...) e tira o app antigo deste endereço.
  if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister())).catch(() => {});
  location.replace('https://henriquegambin.github.io/propostas/' + location.search + location.hash);
</script>

</head>
<body>
<p>O sistema de propostas mudou de endereço.<br><a href="https://henriquegambin.github.io/propostas/">Abrir o novo endereço</a></p>
</body>
</html>
